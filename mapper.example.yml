# Load this file with SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/mapper.yml
mapper:
  professional-edition: false
  email:
    attribute: /email
  first-name:
    attribute: /givenName
  last-name:
    attribute: /familyName

  # Omit tenant-name and tenant-id to use "Tenant " + the mapped email domain.
  # tenant-name:
  #   attribute: /organization/name
  #   prefix: "Tenant "
  # tenant-id:
  #   value: bc89e8f0-8ba9-11ea-97a9-0bc52285619a

  # Configure either customer-name or customer-id.
  # customer-name:
  #   attribute: /CUSTOMER_NAME_ATTRIBUTE
  # customer-id:
  #   value: e78c0ab0-8ba9-11ea-97a9-0bc52285619a

  # These options require professional-edition: true.
  # Configure either parent-customer-name or parent-customer-id.
  # parent-customer-name:
  #   attribute: /PARENT_CUSTOMER_NAME_ATTRIBUTE
  # parent-customer-id:
  #   value: e78c0ab0-8ba9-11ea-97a9-0bc52285619a
  # user-groups:
  #   - value: Managers
  #   - value: Tenant Administrators
  #   - attribute: /CUSTOMER_USER_GROUP
